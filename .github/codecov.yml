codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default: false # disable the default status that measures entire project
      src:
        target: auto
        threshold: 1%
    patch:
      default: false # disable the default status that measures entire project
      src:
        target: 100%
        threshold: 0%

comment:
  require_changes: true
