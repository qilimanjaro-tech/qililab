# Keeps GitHub Actions and Python dependencies up to date.
#
# Grouping strategy: minor + patch bumps are collected into one PR per ecosystem;
# major bumps fall outside the group and therefore get their own PR each, since
# they are the ones that can break us and deserve individual review.
version: 2

# Dependabot does not run our workflows, so it does not inherit their AWS auth.
# It uses OIDC to assume a read-only role and get a short-lived CodeArtifact token
# for private packages (qpysequence). role-name must match the Platform-managed IAM role.
registries:
  codeartifact-qilimanjaro:
    type: python-index
    url: https://qilimanjaro-723412851021.d.codeartifact.eu-west-1.amazonaws.com/pypi/qilimanjaro/simple
    aws-region: eu-west-1
    account-id: "723412851021"
    role-name: GitHub_actions_role_Dependabot
    domain: qilimanjaro
    domain-owner: "723412851021"

updates:
  # ----------------------------- GitHub Actions -----------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      # Without day/time/timezone Dependabot defaults to Monday at a random hour UTC.
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"  # follows CET/CEST, so 09:00 local year-round
    groups:
      actions-minor-patch:
        applies-to: version-updates  # default, stated so the security path stays visible
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
    # Majors arrive as one PR each now, so leave headroom above the default of 5.
    open-pull-requests-limit: 10
    labels: ["dependencies", "github-actions"]

  # -------------------------------- Python ---------------------------------
  - package-ecosystem: "uv"
    directory: "/"
    registries: ["codeartifact-qilimanjaro"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Must match the firmware on our Qblox clusters.
      - dependency-name: "qblox-instruments"
      # Must match the QOP version on the QM hardware.
      - dependency-name: "qm-qua"
      # 0.58 changes GS200 ramping; needs instrument testing first.
      - dependency-name: "qcodes"
      # 2.1 defaults postgresql:// to psycopg 3; we ship psycopg2.
      - dependency-name: "sqlalchemy"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
