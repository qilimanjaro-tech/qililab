name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - "opened"
      - "reopened"
      - "synchronize"
      - "ready_for_review"

jobs:
  code-quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    timeout-minutes: 7

    env:
      HOME_REPO: /home/repo
      CA_DOMAIN: qilimanjaro
      CA_DOMAIN_OWNER: "723412851021"
      CA_REGION: eu-west-1
    
    permissions:
      contents: read
      id-token: write  # OIDC: needed to read the private CodeArtifact indexes during the build

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::723412851021:role/GitHub_actions_role
          aws-region: eu-west-1
          role-session-name: GitHubActions-DevOps
      
      - name: Assume deploy role in target account
        id: chained
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::723412851021:role/Code-Artifact-Publish
          aws-region: eu-west-1
          role-session-name: GitHubActions-Deploy
          role-chaining: true
          role-skip-session-tagging: true
      
      - name: Build wheel and sdist
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.chained.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.chained.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.chained.outputs.aws-session-token }}
          AWS_REGION: eu-west-1
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          # netrc matches on the host, so one entry authenticates every [[tool.uv.index]] on
          # this domain regardless of how the indexes are named or how many there are.
          CA_HOST="${CA_DOMAIN}-${CA_DOMAIN_OWNER}.d.codeartifact.${CA_REGION}.amazonaws.com"
          umask 077
          printf 'machine %s login aws password %s\n' "$CA_HOST" "$TOKEN" > "${RUNNER_TEMP}/codeartifact.netrc"
          export NETRC="${RUNNER_TEMP}/codeartifact.netrc"
          uv sync --group dev --all-extras

      - name: Ruff Lint
        run: uv run ruff check --output-format=github .

      - name: Ruff Format
        run: uv run ruff format --diff --output-format=github .

      - name: Mypy
        run: uv run mypy src --ignore-missing-imports

      - name: Mdformat
        run: uv run mdformat .
