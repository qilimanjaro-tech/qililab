name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - "opened"
      - "reopened"
      - "synchronize"
      - "ready_for_review"

jobs:
  code-quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    timeout-minutes: 7

    env:
      HOME_REPO: /home/repo
      CA_DOMAIN: qilimanjaro
      CA_DOMAIN_OWNER: "723412851021"
      CA_REGION: eu-west-1
    
    permissions:
      contents: read
      id-token: write  # OIDC: needed to read the private CodeArtifact indexes during the build

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::723412851021:role/GitHub_actions_role
          aws-region: eu-west-1
          role-session-name: GitHubActions-DevOps
      
      - name: Assume deploy role in target account
        id: chained
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::723412851021:role/Code-Artifact-Publish
          aws-region: eu-west-1
          role-session-name: GitHubActions-Deploy
          role-chaining: true
          role-skip-session-tagging: true
      
      - name: Authenticate uv to CodeArtifact
        shell: bash
        run: |
          token="$(
            aws codeartifact get-authorization-token \
              --domain "$CA_DOMAIN" \
              --domain-owner "$CA_DOMAIN_OWNER" \
              --region "$CA_REGION" \
              --duration-seconds 0 \
              --query authorizationToken \
              --output text
          )"

          test -n "$token"
          test "$token" != "None"

          # Prevent accidental exposure in GitHub Actions logs.
          echo "::add-mask::$token"

          # These names must match [[tool.uv.index]].name = "qilimanjaro".
          printf 'UV_INDEX_QILIMANJARO_USERNAME=%s\n' "aws" >> "$GITHUB_ENV"
          printf 'UV_INDEX_QILIMANJARO_PASSWORD=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked --group dev --all-extras

      - name: Ruff Lint
        run: uv run ruff check --output-format=github .

      - name: Ruff Format
        run: uv run ruff format --diff --output-format=github .

      - name: Mypy
        run: uv run mypy src --ignore-missing-imports

      - name: Mdformat
        run: uv run mdformat .
