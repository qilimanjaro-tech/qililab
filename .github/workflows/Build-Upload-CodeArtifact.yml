name: Build and Publish to AWS CodeArtifact

# Every step is inlined on purpose. qililab is a PUBLIC repository, and GitHub never lets a
# public repo use actions hosted in a private one — so the shared
# `qilimanjaro-tech/devops/.github/actions/code-artifact-publish` action is unavailable here.
# The deploy job below is the self-contained equivalent of that action (see the devops repo's
# .github/workflows/examples/build-upload-artifact/build-upload-artifact-public-repo.yml
# template); if you change one, mirror it in the other.

on:
  # Manual only: publishing qililab is always a deliberate act, never a side effect of tagging.
  # (Releases publish to PyPI via pythonpublish.yml; CodeArtifact is opt-in from here.)
  workflow_dispatch:
    inputs:
      repository:
        description: "CodeArtifact repository to publish the built distributions to"
        type: string
        required: true
        default: qilimanjaro
      ref:
        description: "Tag/release to publish (null = launch branch)"
        type: string
        required: false
      dry_run:
        description: "Build and validate the distributions, but do not upload them"
        type: boolean
        default: false

concurrency:
  # Keyed on what is actually being published, so two runs for the same tag queue instead of racing.
  group: publish-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    env:
      CA_DOMAIN: qilimanjaro
      CA_DOMAIN_OWNER: "723412851021"
      CA_REGION: eu-west-1
    permissions:
      contents: read
      id-token: write  # OIDC: needed to read the private CodeArtifact indexes during the build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          python-version: "3.13"
      # `pyproject.toml` declares CodeArtifact indexes, so dependency resolution — including
      # `build-system.requires` — needs a CodeArtifact token or the build fails with 401.
      # Inlined equivalent of the devops code-artifact-auth action (unusable from a public repo).
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::723412851021:role/GitHub_actions_role
          aws-region: eu-west-1
          role-session-name: GitHubActions-DevOps
      - name: Assume deploy role in target account
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::723412851021:role/Code-Artifact-Publish
          aws-region: eu-west-1
          role-session-name: GitHubActions-Deploy
          role-chaining: true
          role-skip-session-tagging: true
      - name: Build wheel and sdist
        shell: bash
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          # netrc matches on the host, so one entry authenticates every [[tool.uv.index]] on
          # this domain regardless of how the indexes are named or how many there are.
          CA_HOST="${CA_DOMAIN}-${CA_DOMAIN_OWNER}.d.codeartifact.${CA_REGION}.amazonaws.com"
          umask 077
          printf 'machine %s login aws password %s\n' "$CA_HOST" "$TOKEN" > "${RUNNER_TEMP}/codeartifact.netrc"
          export NETRC="${RUNNER_TEMP}/codeartifact.netrc"
          uv build
      # The deploy job below downloads two artifacts: the wheels (pattern `wheels-*`)
      # and the sdist (name `sdist`). Upload them separately to match that contract.
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-py3
          path: dist/*.whl
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  # Publishes to AWS CodeArtifact. Authentication is GitHub OIDC with role chaining: the job
  # exchanges a short-lived GitHub token for temporary credentials of the entry role, then
  # chains into the Code-Artifact-Publish role that holds the CodeArtifact permissions — no
  # AWS keys are stored in GitHub.
  deploy-codeartifacts:
    name: Publish Artifact ${{ inputs.repository }}
    runs-on: ubuntu-latest
    needs: [build]
    env:
      AWS_REGION: eu-west-1
      CA_DOMAIN: qilimanjaro
      CA_DOMAIN_OWNER: "723412851021"
      CA_REPOSITORY: ${{ inputs.repository }}
    permissions:
      contents: read
      id-token: write  # required to request the OIDC token for AWS
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::723412851021:role/GitHub_actions_role
          aws-region: eu-west-1
          role-session-name: GitHubActions-DevOps
      - name: Assume deploy role in target account
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::723412851021:role/Code-Artifact-Publish
          aws-region: eu-west-1
          role-session-name: GitHubActions-Deploy
          role-chaining: true
          role-skip-session-tagging: true
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: false
          python-version: "3.13"
      - name: List & validate distributions
        run: |
          ls -lh dist
          uvx twine check dist/*
      # Gets a temporary CodeArtifact token + repository endpoint with the AWS CLI and
      # uploads with twine. Skipped entirely on dry runs.
      - name: Publish to CodeArtifact
        if: ${{ !inputs.dry_run }}
        run: |
          export TWINE_USERNAME=aws
          export TWINE_PASSWORD=$(aws codeartifact get-authorization-token \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          export TWINE_REPOSITORY_URL=$(aws codeartifact get-repository-endpoint \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_DOMAIN_OWNER" \
            --repository "$CA_REPOSITORY" \
            --format pypi \
            --query repositoryEndpoint \
            --output text)
          uvx twine upload dist/*
