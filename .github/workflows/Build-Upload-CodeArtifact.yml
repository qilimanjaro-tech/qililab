name: Build and Publish to AWS CodeArtifact

on:
  # Manual only: publishing qililab is always a deliberate act, never a side effect of tagging.
  # (Releases publish to PyPI via pythonpublish.yml; CodeArtifact is opt-in from here.)
  workflow_dispatch:
    inputs:
      repository:
        description: "CodeArtifact repository to publish the built distributions to"
        type: string
        required: true
        default: qilimanjaro
      ref:
        description: "Tag/release to publish (null = launch branch)"
        type: string
        required: false
      dry_run:
        description: "Build and validate the distributions, but do not upload them"
        type: boolean
        default: false

concurrency:
  # Keyed on what is actually being published, so two runs for the same tag queue instead of racing.
  group: publish-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          python-version: "3.13"
      - name: Build wheel and sdist
        run: uv build
      # The publish action downloads two artifacts: the wheels (pattern `wheels-*`)
      # and the sdist (name `sdist`). Upload them separately to match that contract.
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-py3
          path: dist/*.whl
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  deploy-codeartifacts:
    # Dispatch-only, so `inputs.repository` is always set (required, defaults to qilimanjaro).
    name: Publish Artifact ${{ inputs.repository }}
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Publish to CodeArtifact
        uses: qilimanjaro-tech/devops/.github/actions/code-artifact-publish@main
        with:
          repository: ${{ inputs.repository }}
          dry-run: ${{ inputs.dry_run }}